<!DOCTYPE html>
<html>

<head>
  <title>Pradhyumn Bhaskara</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      background: #0a0f1e;
      color: white;
      padding: 60px 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(79, 172, 254, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
    }

    /* Header */
    .profile-header {
      text-align: center;
      margin-bottom: 52px;
    }

    .avatar-ring {
      display: inline-flex;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4facfe, #00f2fe, #43e97b);
      margin-bottom: 20px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #0f1b2d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #4facfe;
      letter-spacing: 1px;
    }

    .profile-header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .profile-header .handle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      margin: 20px auto 0;
      border-radius: 2px;
    }

    /* Grid */
    .tiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 18px;
    }

    .tile {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      transition: border-color 0.3s, transform 0.3s;
    }

    .tile:hover {
      border-color: rgba(79, 172, 254, 0.3);
      transform: translateY(-2px);
    }

    .tile.wide {
      grid-column: span 2;
    }

    .tile-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #4facfe;
      margin-bottom: 16px;
    }

    .tile-label::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4facfe;
      flex-shrink: 0;
    }

    /* About */
    .tile p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
    }

    /* Skills */
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill-tag {
      background: rgba(79, 172, 254, 0.1);
      border: 1px solid rgba(79, 172, 254, 0.25);
      color: #a8d8f8;
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
    }

    .skill-tag:hover {
      background: rgba(79, 172, 254, 0.2);
      border-color: rgba(79, 172, 254, 0.5);
    }

    /* Social */
    .social-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s;
    }

    .social-link:hover {
      color: white;
      background: rgba(79, 172, 254, 0.15);
      border-color: rgba(79, 172, 254, 0.4);
      transform: translateY(-1px);
    }

    .social-link svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (max-width: 580px) {
      .tiles {
        grid-template-columns: 1fr;
      }

      .tile.wide {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="profile-header">
      <div class="avatar-ring">
        <div class="avatar">PB</div>
      </div>
      <h1>Pradhyumn Bhaskara</h1>
      <p class="handle">@gitpradhyumn</p>
      <div class="divider"></div>
    </div>

    <div class="tiles">

      <div class="tile wide">
        <div class="tile-label">About</div>
        <p>
          Hi, I'm Pradhyumn - a passionate developer who loves building clean, functional software.
          I enjoy exploring new technologies and turning ideas into real, meaningful projects.
        </p>
      </div>

      <div class="tile">
        <div class="tile-label">Skills</div>
        <div class="skills-list">
          <span class="skill-tag">HTML</span>
          <span class="skill-tag">CSS</span>
          <span class="skill-tag">JavaScript</span>
          <span class="skill-tag">Python</span>
          <span class="skill-tag">Git</span>
          <span class="skill-tag">Problem Solving</span>
        </div>
      </div>

      <div class="tile">
        <div class="tile-label">Connect</div>
        <div class="social-links">
          <a href="https://github.com/gitpradhyumn" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                d="M12 .5C5.65.5.5 5.65.5 12c0 5.1 3.29 9.42 7.86 10.95.57.1.78-.25.78-.55v-2.1c-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98.01 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.13v3.16c0 .3.2.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
            </svg>
            GitHub
          </a>
          <a href="mailto:bhaskarapradhyumn@gmail.com" class="social-link">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z" />
            </svg>
            Email Me
          </a>
        </div>
      </div>

    </div>
  </div>
</body>

</html>
